# session-skills configuration. Copy to ~/.config/session-skills/config.toml and edit.
# Every key is optional; the values shown are the defaults unless noted.

# Private state (one SQLite database plus the generated report). Must be outside any repository.
state_dir = "~/.local/state/session-skills"

[sources.claude_code]
enabled = true
paths = ["~/.claude/projects/**/*.jsonl"]

[sources.codex]
enabled = true
paths = ["~/.codex/sessions/**/*.jsonl", "~/.codex/archived_sessions/**/*.jsonl"]

[sources.opencode]
enabled = true
paths = ["~/.local/share/opencode/opencode*.db", "~/.local/share/opencode/storage"]

[tag]
backend = "claude:haiku"       # cheap model: one short classification per chat part
max_requests = 200             # hard cap on backend calls per run, retries and parts included
max_chars = 90000              # longer chats are split into parts
retries = 3                    # tries per part (each one counts against max_requests)
retry_delay = 2.0              # seconds before the first retry; doubles each time
max_consecutive_failures = 3   # stop the run when this many chats fail in a row
timeout = 300

[calibrate]
backend = "codex"              # must be a different model family from the tagger
sample_size = 30
max_requests = 100             # hard cap on backend calls per calibrate run
min_agreement = 0.8
min_support = 20               # labelled chats needed before a question can be called reliable
min_positives = 4              # labeller positives needed, per question, for the same
default_threshold = 0.7

[brief]
min_chats = 3                  # a pattern needs at least this many chats
stale_days = 60                # patterns not seen for this long are dropped

[repeated]
max_chars = 200                # only short messages count as "asks"
min_sessions = 3

[redact]
deny_words = []                # e.g. people, customers, project code names (example values only)
extra_patterns = []            # extra regular expressions to remove
max_block_lines = 12           # longer pasted blocks are replaced by a placeholder

[privacy]
local_only = false             # true: refuse every backend that is not provably on this machine
allow_remote = false           # true: let ollama use a non-loopback OLLAMA_HOST or a cloud model
pass_env = []                  # extra environment variable names worker CLIs may see
