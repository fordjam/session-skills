[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "session-skills"
version = "0.1.0"
description = "Mine your own AI coding-agent session history for repeated corrections (-> instructions and skills) and repeated asks (-> automation candidates)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "session-skills contributors" }]
keywords = ["claude-code", "codex", "opencode", "agents", "skills", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
session-skills = "session_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/session_skills"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# fixture corpora and the question table are data; wrapping them hurts readability
"src/session_skills/synthetic.py" = ["E501"]
"src/session_skills/questions.py" = ["E501"]
